name: Mutation testing (non-blocking)

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  testteeth:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: never blocks a merge
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Grade the core modules (scorer, schema, data cleaning, pairs, formatting)
        run: testteeth run --workers 2 --json mutation.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation.json
