# The run whose numbers are in the README: plain LoRA in fp32 on a shared 2-vCPU ARM box, no GPU.
# fp32, not bf16: on this aarch64 box a 300-token forward+backward took ~35-39 s in fp32 vs ~326 s in
# bf16 (work/logs/bench2*.log; torch's CPU bf16 path is far slower here).
# Small on purpose (see README "How big was the run"). Every stage resumes from its checkpoints.
run_name: cpu-small

model:
  name_or_path: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  dtype: float32
  quantization: none          # QLoRA needs CUDA; see gpu_qlora.yaml
  gradient_checkpointing: false
  num_threads: 2

data:
  bfcl_categories: [simple, multiple, parallel, irrelevance]
  bfcl_eval_per_category: {simple: 50, multiple: 50, parallel: 50, irrelevance: 50}
  glaive_eval_per_category: {simple: 50, multiple: 50, irrelevance: 50}
  train_per_category: {simple: 500, multiple: 500, irrelevance: 350, clarify: 150}
  dpo_prompts: 400
  decontam_ngram: 8
  max_chars: 2600

sft:
  output_dir: outputs/sft
  num_examples: 160           # first 160 of train.jsonl (mixed categories); 20 optimizer steps
  max_length: 512
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 8
  save_steps: 2
  logging_steps: 1
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    layers_to_transform: [16, 17, 18, 19, 20, 21, 22, 23]   # top 8 of 24 decoder layers

dpo:
  output_dir: outputs/dpo
  sft_adapter: outputs/sft/adapter
  num_prompts: 40             # 5 optimizer steps of 8 pairs
  samples_per_prompt: 1       # greedy only: sampling on CPU is the expensive part
  temperature: 0.8
  max_new_tokens: 96
  synthetic_negatives: true
  beta: 0.1
  lr: 5.0e-5
  epochs: 1
  batch_size: 1
  grad_accum: 8
  max_length: 512
  max_prompt_length: 448
  save_steps: 1
  logging_steps: 1
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    layers_to_transform: [16, 17, 18, 19, 20, 21, 22, 23]

eval:
  files: [data/processed/eval_bfcl.jsonl]   # held-out glaive set exists but was not run (CPU time)
  limit_per_category: 50
  max_new_tokens: 160
  batch_size: 4
  n_bootstrap: 2000
  models:
    - {name: base}
    - {name: sft, adapters: [outputs/sft/adapter]}
    - {name: sft+dpo, adapters: [outputs/sft/adapter, outputs/dpo/adapter]}

export:
  adapters: [outputs/sft/adapter, outputs/dpo/adapter]
  merged_dir: outputs/merged
  gguf_path: outputs/gguf/toolforge-qwen2.5-0.5b-f16.gguf
  gguf_outtype: f16
  quantize: [Q8_0]

serve:
  gguf_path: outputs/gguf/toolforge-qwen2.5-0.5b-q8_0.gguf
  port: 8091
  ctx_size: 4096
  threads: 2

tracking:
  backend: mlflow
  mlflow_uri: file:./mlruns
  experiment: toolforge
