[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolforge"
version = "0.1.0"
description = "Reproducible fine-tuning pipeline that teaches small open models reliable function calling (data -> LoRA SFT -> DPO -> BFCL-style eval -> GGUF)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }]
requires-python = ">=3.10"
keywords = ["llm", "function-calling", "tool-use", "lora", "qlora", "dpo", "bfcl", "fine-tuning", "gguf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The core (data cleaning, formatting, scorer, pair builder, CLI) is pure Python.
dependencies = [
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
train = [
    "torch>=2.3,<3",
    "transformers>=4.56,<6",
    "peft>=0.17,<1",
    "trl>=1.0,<2",
    "datasets>=3.0,<6",
    "accelerate>=1.0,<2",
    "safetensors>=0.4,<1",
    "huggingface_hub>=0.30,<2",
    "mlflow-skinny>=2.15,<4",
]
qlora = ["bitsandbytes>=0.45,<1"]
export = ["gguf>=0.10,<1", "sentencepiece>=0.2,<1", "protobuf>=4,<7"]
serve = []
wandb = ["wandb>=0.17,<1"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "mypy>=1.10,<3",
    "types-PyYAML>=6,<7",
    "build>=1.2,<2",
    "testteeth>=0.2,<1",
]

[project.scripts]
toolforge = "toolforge.cli:main"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/toolforge"
Issues = "https://github.com/fernandogarzaaa/toolforge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: end-to-end pipeline run on a tiny random model (needs the [train] extra)",
    "parity: checks the prompt renderer against the real Qwen2.5 chat template (needs the model locally)",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF005", "SIM105", "SIM108", "B905"]  # E501: line length is left to `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "RUF012"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/toolforge"]
plugins = ["pydantic.mypy"]

[tool.testteeth]
paths = [
    "src/toolforge/scorer.py",
    "src/toolforge/schema.py",
    "src/toolforge/data/clean.py",
    "src/toolforge/data/glaive.py",
    "src/toolforge/pairs.py",
    "src/toolforge/formatting.py",
]
test_args = ["tests", "--ignore=tests/smoke", "-m", "not smoke and not parity"]  # smoke imports torch at collection

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "trl.*", "datasets.*", "safetensors.*", "huggingface_hub.*", "mlflow.*", "wandb.*", "tokenizers.*"]
follow_imports = "skip"
ignore_missing_imports = true
