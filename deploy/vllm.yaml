# UNTESTED. vLLM serving config for the merged checkpoint (vLLM needs a GPU; not run by the author).
# Usage:  vllm serve outputs/merged --config deploy/vllm.yaml
served-model-name: toolforge
host: 0.0.0.0
port: 8000
dtype: bfloat16
max-model-len: 4096
gpu-memory-utilization: 0.85
enable-auto-tool-choice: true
tool-call-parser: hermes        # Qwen2.5 emits <tool_call>{...}</tool_call> (hermes format)
generation-config: auto
